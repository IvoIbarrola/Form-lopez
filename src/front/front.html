<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Registro Evento</title>

<style>
.error {
    color: red;
    font-size: 12px;
}
input, select {
    margin-bottom: 5px;
}
</style>

<script>
function mostrarError(id, mensaje) {
    document.getElementById(id).innerText = mensaje;
}

function validarNombre() {
    let valor = document.getElementById("nombre").value.trim();
    if (valor === "") {
        mostrarError("errorNombre", "El nombre es obligatorio");
        return false;
    }
    mostrarError("errorNombre", "");
    return true;
}

function validarApellido() {
    let valor = document.getElementById("apellido").value.trim();
    if (valor === "") {
        mostrarError("errorApellido", "El apellido es obligatorio");
        return false;
    }
    mostrarError("errorApellido", "");
    return true;
}

function validarEmail() {
    let valor = document.getElementById("email").value.trim();
    let regex = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;

    if (!regex.test(valor)) {
        mostrarError("errorEmail", "Email inválido");
        return false;
    }
    mostrarError("errorEmail", "");
    return true;
}

function validarFecha() {
    let valor = document.getElementById("fecha").value.trim();
    let regex = /^\d{2}\/\d{2}\/\d{4}$/;

    if (!regex.test(valor)) {
        mostrarError("errorFecha", "Formato inválido (dd/mm/aaaa)");
        return false;
    }

    let [d, m, a] = valor.split("/");
    let fecha = new Date(a, m - 1, d);
    let hoy = new Date();

    let edad = hoy.getFullYear() - fecha.getFullYear();

    if (
        hoy.getMonth() < (m - 1) ||
        (hoy.getMonth() === (m - 1) && hoy.getDate() < d)
    ) {
        edad--;
    }

    if (edad < 16) {
        mostrarError("errorFecha", "Debes tener al menos 16 años");
        return false;
    }

    mostrarError("errorFecha", "");
    return true;
}

function validarTelefono() {
    let valor = document.getElementById("telefono").value.trim();
    let regex = /^[0-9]{8,15}$/;

    if (!regex.test(valor)) {
        mostrarError("errorTelefono", "Teléfono inválido");
        return false;
    }

    mostrarError("errorTelefono", "");
    return true;
}

function validarPuesto() {
    let valor = document.getElementById("puesto").value;

    if (valor === "") {
        mostrarError("errorPuesto", "Seleccione un puesto");
        return false;
    }

    mostrarError("errorPuesto", "");
    return true;
}

function validarEventos() {
    let checks = document.querySelectorAll('input[name="eventos[]"]:checked');

    if (checks.length === 0) {
        mostrarError("errorEventos", "Seleccione al menos uno");
        return false;
    }

    mostrarError("errorEventos", "");
    return true;
}

function validarRango() {
    let valor = document.getElementById("rango").value.trim();
    let regex = /^[0-9]+-[0-9]+$/;

    if (!regex.test(valor)) {
        mostrarError("errorRango", "Formato: 200000-300000");
        return false;
    }

    let [min, max] = valor.split("-").map(Number);

    if (min > max) {
        mostrarError("errorRango", "Mín > Máx");
        return false;
    }

    mostrarError("errorRango", "");
    return true;
}

// Validación final al enviar
function validarFormulario(e) {
    if (
        !validarNombre() |
        !validarApellido() |
        !validarEmail() |
        !validarFecha() |
        !validarTelefono() |
        !validarPuesto() |
        !validarEventos() |
        !validarRango()
    ) {
        e.preventDefault();
    }
}
</script>

</head>
<body>

<h2>Registro a Evento Tecnológico</h2>

<form onsubmit="validarFormulario(event)" action="http://localhost:8080/back/procesar.php" method="POST">

    Nombre:<br>
    <input id="nombre" name="nombre" oninput="validarNombre()">
    <div id="errorNombre" class="error"></div><br>

    Apellido:<br>
    <input id="apellido" name="apellido" oninput="validarApellido()">
    <div id="errorApellido" class="error"></div><br>

    Email:<br>
    <input id="email" name="email" oninput="validarEmail()">
    <div id="errorEmail" class="error"></div><br>

    Fecha (dd/mm/aaaa):<br>
    <input id="fecha" name="fecha_nacimiento" oninput="validarFecha()">
    <div id="errorFecha" class="error"></div><br>

    Teléfono:<br>
    <input id="telefono" name="telefono" oninput="validarTelefono()">
    <div id="errorTelefono" class="error"></div><br>

    Puesto:<br>
    <select id="puesto" name="puesto" onchange="validarPuesto()">
        <option value="">Seleccione</option>
        <option>Desarrollador</option>
        <option>Tester</option>
        <option>Administrador</option>
        <option>Soporte</option>
    </select>
    <div id="errorPuesto" class="error"></div><br>

    Eventos:<br>
    <input type="checkbox" name="eventos[]" onchange="validarEventos()"> Backend<br>
    <input type="checkbox" name="eventos[]" onchange="validarEventos()"> Frontend<br>
    <input type="checkbox" name="eventos[]" onchange="validarEventos()"> DevOps<br>
    <input type="checkbox" name="eventos[]" onchange="validarEventos()"> IA<br>
    <input type="checkbox" name="eventos[]" onchange="validarEventos()"> Seguridad<br>
    <div id="errorEventos" class="error"></div><br>

    Rango:<br>
    <input id="rango" name="rango" oninput="validarRango()">
    <div id="errorRango" class="error"></div><br>

    <button type="submit">Enviar</button>

</form>

</body>
</html>
